name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The gitleaks-action needs a paid licence for organisation repos, so run the
      # MIT-licensed release binary directly, pinned and checksum-verified.
      #
      # GitHub's release download answered 504 to every runner for most of an
      # hour on 8 November 2026, which failed this required check on every open
      # PR. So the release host is not the only source: the verified tarball is
      # cached, and when the release host is down the same tag is built from the
      # Go module proxy, whose checksum database verifies the source.
      - name: Restore gitleaks
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/gitleaks-dl
          key: gitleaks-8.30.1-linux-x64

      - name: Install gitleaks
        id: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dl="$RUNNER_TEMP/gitleaks-dl"
          bin="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dl" "$bin"
          cd "$dl"
          verified() { [ -f "$tarball" ] && echo "$GITLEAKS_SHA256  $tarball" | sha256sum -c --status -; }
          if verified; then
            echo "Using cached gitleaks ${GITLEAKS_VERSION}"
          else
            rm -f "$tarball"
            if curl -fsSL --retry 5 --retry-delay 10 --retry-max-time 120 -o "$tarball" "$base/$tarball" && verified; then
              echo "save=true" >> "$GITHUB_OUTPUT"
            else
              rm -f "$tarball"
            fi
          fi
          if verified; then
            tar -xzf "$tarball" -C "$bin" gitleaks
          else
            echo "::warning::gitleaks release download unavailable; building v${GITLEAKS_VERSION} from the Go module proxy"
            GOTOOLCHAIN=auto GOBIN="$bin" go install "github.com/zricethezav/gitleaks/v8@v${GITLEAKS_VERSION}"
          fi
          "$bin/gitleaks" version
          echo "$bin" >> "$GITHUB_PATH"

      - name: Cache gitleaks
        if: steps.gitleaks.outputs.save == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/gitleaks-dl
          key: gitleaks-8.30.1-linux-x64

      - name: Scan for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              log_opts="--diff-merges=first-parent ${PR_BASE_SHA}..${PR_HEAD_SHA}"
              ;;
            push)
              if [ "$PUSH_BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
                || ! git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
                log_opts="--diff-merges=first-parent -1 ${PUSH_AFTER_SHA}"
              else
                log_opts="--diff-merges=first-parent ${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
              fi
              ;;
            *)
              # gitleaks adds --full-history --all --diff-filter=tuxdb only when
              # --log-opts is empty, so restate it to keep every fetched ref in scope.
              log_opts="--diff-merges=first-parent --full-history --all --diff-filter=tuxdb"
              ;;
          esac
          echo "Scanning git history with: git log $log_opts"
          gitleaks git --redact --exit-code 1 --log-opts="$log_opts" .
